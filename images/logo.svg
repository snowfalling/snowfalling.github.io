<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ronald's Blog">
  <defs>
    <linearGradient id="sf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa6a0"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
  </defs>

  <!-- 清透圆角底 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#3aa6a0" fill-opacity="0.12"/>

  <!-- 六大主干 + 侧枝，几何对称 -->
  <g stroke="url(#sf-grad)" stroke-linecap="round" fill="none">
    <!-- 垂直与水平主轴 -->
    <path d="M32 9v46"/>
    <path d="M9 32h46"/>
    <!-- 两条斜轴 -->
    <path d="M15.7 15.7l32.6 32.6"/>
    <path d="M48.3 15.7L15.7 48.3"/>
    <!-- 每条主干两侧的 V 形侧枝 -->
    <path d="M32 15l6 4"/>
    <path d="M32 15l-6 4"/>
    <path d="M32 49l6-4"/>
    <path d="M32 49l-6-4"/>
    <path d="M15 32l4 6"/>
    <path d="M15 32l4-6"/>
    <path d="M49 32l-4 6"/>
    <path d="M49 32l-4-6"/>
    <path d="M18.5 18.5l5.3 2.7"/>
    <path d="M18.5 18.5l2.7 5.3"/>
    <path d="M45.5 45.5l-5.3-2.7"/>
    <path d="M45.5 45.5l-2.7-5.3"/>
    <path d="M45.5 18.5l-2.7 5.3"/>
    <path d="M45.5 18.5l-5.3 2.7"/>
    <path d="M18.5 45.5l2.7-5.3"/>
    <path d="M18.5 45.5l5.3-2.7"/>
  </g>

  <!-- 主干末端小圆点 -->
  <g fill="url(#sf-grad)">
    <circle cx="32" cy="9" r="1.8"/>
    <circle cx="32" cy="55" r="1.8"/>
    <circle cx="9" cy="32" r="1.8"/>
    <circle cx="55" cy="32" r="1.8"/>
    <circle cx="15" cy="15" r="1.8"/>
    <circle cx="49" cy="49" r="1.8"/>
    <circle cx="49" cy="15" r="1.8"/>
    <circle cx="15" cy="49" r="1.8"/>
  </g>

  <!-- 中心晶核 -->
  <circle cx="32" cy="32" r="4" fill="#3aa6a0"/>
</svg>